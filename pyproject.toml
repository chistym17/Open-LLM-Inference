[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "open-llm-inference-platform"
version = "0.1.0"
description = "A hands-on platform for studying and benchmarking open LLM inference systems."
requires-python = ">=3.10"
dependencies = [
    "torch",
    "transformers",
    "accelerate",
    "pyyaml",
    "pynvml",
]

[tool.setuptools.packages.find]
where = ["src"]